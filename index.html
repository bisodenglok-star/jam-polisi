<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Jam 4 Armada Nusantara</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="clocks-grid">
    <!-- 1. DARAT: KONVOI DARURAT -->
    <div class="clock-card">
      <div class="clock-face" id="policeClock">
        <div class="lane l-out"></div><div class="lane l-mid"></div><div class="lane l-in"></div>
        <div class="center-island" id="dig1">00:00</div>
        <div class="orbit" id="ambOrbit">
          <svg class="v-in" viewBox="0 0 100 52">
            <rect x="4" y="6" width="90" height="40" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
            <rect x="33" y="16" width="8" height="20" fill="#ef4444"/><rect x="27" y="22" width="20" height="8" fill="#ef4444"/>
            <rect class="siren-red active-red" x="63" y="13" width="6" height="26" rx="2" fill="#ef4444"/>
          </svg>
        </div>
        <div class="orbit" id="motoOrbit">
          <svg class="v-mid" viewBox="0 0 100 50">
            <rect x="12" y="14" width="16" height="22" rx="3" fill="#fff"/>
            <rect x="24" y="16" width="52" height="18" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
            <circle cx="48" cy="25" r="9" fill="#fff" stroke="#0f172a" stroke-width="2"/>
            <rect class="siren-blue active-blue" x="15" y="18" width="6" height="14" rx="2" fill="#3b82f6"/>
          </svg>
        </div>
        <div class="orbit sec-smooth" id="carOrbit">
          <svg class="v-out" viewBox="0 0 100 50">
            <rect x="6" y="7" width="88" height="36" rx="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
            <rect x="28" y="10" width="42" height="30" rx="5" fill="#fff"/>
            <rect id="sirenRed" class="siren-red" x="45" y="11" width="8" height="13" rx="2" fill="#ef4444"/>
            <rect id="sirenBlue" class="siren-blue" x="45" y="26" width="8" height="13" rx="2" fill="#3b82f6"/>
          </svg>
        </div>
      </div>
      <div class="legend">🚑 Jam • 🏍️ Menit • 🚓 Detik</div>
    </div>

    <!-- 2. REL: KERETA API INDONESIA -->
    <div class="clock-card">
      <div class="clock-face train-face" id="trainClock">
        <div class="track l-out"></div><div class="track l-mid"></div><div class="track l-in"></div>
        <div class="center-island" id="dig2">00:00</div>
        <div class="orbit" id="steamOrbit">
          <svg class="v-in" viewBox="0 0 100 50">
            <rect x="8" y="12" width="32" height="26" rx="4" fill="#dc2626"/>
            <rect x="40" y="15" width="48" height="20" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
            <circle cx="76" cy="25" r="5" fill="#f59e0b"/>
          </svg>
        </div>
        <div class="orbit" id="krlOrbit">
          <svg class="v-mid" viewBox="0 0 110 46">
            <rect x="6" y="10" width="98" height="26" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/>
            <rect x="18" y="13" width="64" height="5" fill="#dc2626"/><rect x="18" y="28" width="64" height="5" fill="#f59e0b"/>
          </svg>
        </div>
        <div class="orbit sec-smooth" id="kaiOrbit">
          <svg class="full-svg" viewBox="0 0 266 266">
            <g transform="translate(133,133) rotate(-38) translate(0,-100)">
              <rect x="-13" y="-5.5" width="26" height="11" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
              <rect x="-12" y="-4.5" width="24" height="2" fill="#1d4ed8"/><rect x="-12" y="2.5" width="24" height="2" fill="#f97316"/>
            </g>
            <g transform="translate(133,133) rotate(-19) translate(0,-100)">
              <rect x="-13" y="-5.5" width="26" height="11" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
              <rect x="-12" y="-4.5" width="24" height="2" fill="#1d4ed8"/><rect x="-12" y="2.5" width="24" height="2" fill="#f97316"/>
            </g>
            <g transform="translate(133,133) rotate(0) translate(0,-100)">
              <rect x="-15" y="-6" width="31" height="12" rx="2.5" fill="#fff"/>
              <rect x="-13" y="-5.5" width="20" height="2.2" fill="#1e3a8a"/><rect x="-13" y="3.3" width="20" height="2.2" fill="#1e3a8a"/>
              <path d="M7 -5.5 H14 Q17 -5.5 17 0 Q17 5.5 14 5.5 H7 Z" fill="#f97316"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="legend">🚂 Jam • 🚃 Menit • 🇮🇩 KAI Detik</div>
    </div>

    <!-- 3. LAUT: ARMADA SAMUDRA -->
    <div class="clock-card">
      <div class="clock-face sea-face" id="seaClock">
        <div class="wave l-out"></div><div class="wave l-mid"></div><div class="wave l-in"></div>
        <div class="center-island" id="dig3">00:00</div>
        <!-- Kapal Feri/Pesiar (Jam) -->
        <div class="orbit" id="ferryOrbit">
          <svg class="v-in" viewBox="0 0 110 50">
            <path d="M10 12 H75 L102 25 L75 38 H10 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
            <rect x="22" y="17" width="46" height="16" rx="3" fill="#38bdf8"/>
            <rect x="35" y="20" width="12" height="10" fill="#ef4444"/>
          </svg>
        </div>
        <!-- Kapal Patroli TNI AL (Menit) -->
        <div class="orbit" id="navyOrbit">
          <svg class="v-mid" viewBox="0 0 110 46">
            <path d="M8 14 H76 L104 23 L76 32 H8 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
            <rect x="32" y="17" width="28" height="12" rx="2" fill="#334155"/>
            <circle cx="72" cy="23" r="4" fill="#94a3b8"/>
          </svg>
        </div>
        <!-- Speedboat Cepat + Jejak Ombak (Detik) -->
        <div class="orbit sec-smooth" id="boatOrbit">
          <svg class="v-out" viewBox="0 0 110 46">
            <path d="M2 15 L25 23 L2 31" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>
            <path d="M24 12 H72 L102 23 L72 34 H24 Z" fill="#f97316" stroke="#fff" stroke-width="1.5"/>
            <path d="M55 15 L76 23 L55 31 Z" fill="#0f172a"/>
          </svg>
        </div>
      </div>
      <div class="legend">🛳️ Jam • 🚢 Menit • 🚤 Detik</div>
    </div>

    <!-- 4. UDARA: ARMADA LANGIT & RADAR -->
    <div class="clock-card">
      <div class="clock-face sky-face" id="skyClock">
        <div class="radar l-out"></div><div class="radar l-mid"></div><div class="radar l-in"></div>
        <div class="center-island" id="dig4">00:00</div>
        <!-- Balon Udara / Zeppelin (Jam) -->
        <div class="orbit" id="blimpOrbit">
          <svg class="v-in" viewBox="0 0 100 54">
            <ellipse cx="52" cy="27" rx="38" ry="18" fill="#f43f5e" stroke="#ffe4e6" stroke-width="2"/>
            <path d="M16 14 L28 27 L16 40 Z" fill="#be123c"/>
            <ellipse cx="54" cy="27" rx="26" ry="7" fill="#fda4af"/>
          </svg>
        </div>
        <!-- Helikopter (Menit) -->
        <div class="orbit" id="heliOrbit">
          <svg class="v-mid" viewBox="0 0 110 60">
            <rect x="8" y="27" width="42" height="6" rx="2" fill="#10b981"/>
            <rect x="6" y="20" width="5" height="20" rx="2" fill="#059669"/>
            <ellipse cx="64" cy="30" rx="24" ry="13" fill="#10b981" stroke="#d1fae5" stroke-width="1.5"/>
            <line x1="36" y1="10" x2="92" y2="50" stroke="#e2e8f0" stroke-width="2.5" opacity="0.8"/>
            <line x1="92" y1="10" x2="36" y2="50" stroke="#e2e8f0" stroke-width="2.5" opacity="0.8"/>
          </svg>
        </div>
        <!-- Pesawat Jet (Detik) -->
        <div class="orbit sec-smooth" id="jetOrbit">
          <svg class="v-out" viewBox="0 0 110 70">
            <path d="M42 35 L26 6 L46 6 L68 35 L46 64 L26 64 Z" fill="#e2e8f0"/>
            <path d="M16 35 L8 20 L20 20 L30 35 L20 50 L8 50 Z" fill="#94a3b8"/>
            <path d="M12 31 H84 Q102 31 106 35 Q102 39 84 39 H12 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
            <ellipse cx="84" cy="35" rx="8" ry="3" fill="#0284c7"/>
          </svg>
        </div>
      </div>
      <div class="legend">🎈 Jam • 🚁 Menit • ✈️ Detik</div>
    </div>
  </div>

  <div class="digital-sub" id="dateText">Memuat tanggal...</div>
  <script src="script.js"></script>
</body>
</html>
