<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Jam Polisi & Kereta Api</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="clocks-wrapper">
    <!-- JAM 1: KONVOI DARURAT -->
    <div class="clock-card">
      <div class="clock-face" id="policeClock">
        <div class="lane-outer"></div>
        <div class="lane-inner"></div>
        <div class="lane-hour"></div>
        <div class="center-island" id="digital1">00:00</div>

        <div class="orbit" id="ambOrbit">
          <svg class="veh-inner" viewBox="0 0 100 52">
            <rect x="4" y="6" width="90" height="40" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
            <rect x="33" y="16" width="8" height="20" fill="#ef4444"/>
            <rect x="27" y="22" width="20" height="8" fill="#ef4444"/>
            <path d="M72 9 L84 13 L84 39 L72 43 Z" fill="#1e293b"/>
            <rect class="siren-red active-red" x="63" y="13" width="6" height="26" rx="2" fill="#ef4444"/>
          </svg>
        </div>

        <div class="orbit" id="motoOrbit">
          <svg class="veh-mid" viewBox="0 0 100 50">
            <rect x="12" y="14" width="16" height="22" rx="3" fill="#fff"/>
            <rect x="24" y="16" width="52" height="18" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
            <circle cx="48" cy="25" r="9" fill="#fff" stroke="#0f172a" stroke-width="2"/>
            <rect class="siren-blue active-blue" x="15" y="18" width="6" height="14" rx="2" fill="#3b82f6"/>
          </svg>
        </div>

        <div class="orbit sec-smooth" id="carOrbit">
          <svg class="veh-outer" viewBox="0 0 100 50">
            <rect x="6" y="7" width="88" height="36" rx="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
            <rect x="28" y="10" width="42" height="30" rx="5" fill="#fff"/>
            <rect id="sirenRed" class="siren-red" x="45" y="11" width="8" height="13" rx="2" fill="#ef4444"/>
            <rect id="sirenBlue" class="siren-blue" x="45" y="26" width="8" height="13" rx="2" fill="#3b82f6"/>
          </svg>
        </div>
      </div>
      <div class="legend">🚑 Jam • 🏍️ Menit • 🚓 Detik</div>
    </div>

    <!-- JAM 2: KERETA API (1 LOKOMOTIF + 2 GERBONG) -->
    <div class="clock-card">
      <div class="clock-face train-face" id="trainClock">
        <div class="track-outer"></div>
        <div class="track-inner"></div>
        <div class="track-hour"></div>
        <div class="center-island" id="digital2">00:00</div>

        <!-- Kereta Uap + 2 Gerbong (Jam - Melengkung Ikuti Rel) -->
        <div class="orbit" id="steamOrbit">
          <svg class="train-inner-svg" viewBox="0 0 160 70">
            <!-- Gerbong 2 (Paling Belakang) -->
            <g transform="translate(22, 34) rotate(-32)">
              <rect x="-15" y="-8" width="30" height="16" rx="3" fill="#b45309" stroke="#fde68a" stroke-width="1.5"/>
            </g>
            <!-- Gerbong 1 (Tengah) -->
            <g transform="translate(50, 19) rotate(-15)">
              <rect x="-15" y="-8" width="30" height="16" rx="3" fill="#d97706" stroke="#fde68a" stroke-width="1.5"/>
            </g>
            <!-- Lokomotif Utama (Depan - Tepat di Puncak) -->
            <g transform="translate(82, 14)">
              <rect x="-18" y="-9" width="36" height="18" rx="4" fill="#dc2626" stroke="#fbbf24" stroke-width="1.5"/>
              <circle cx="11" cy="0" r="3.5" fill="#fef08a"/>
            </g>
          </svg>
        </div>

        <!-- Kereta Ekspres/KRL + 2 Gerbong (Menit) -->
        <div class="orbit" id="krlOrbit">
          <svg class="train-mid-svg" viewBox="0 0 200 70">
            <!-- Gerbong 2 -->
            <g transform="translate(36, 28) rotate(-25)">
              <rect x="-18" y="-8" width="36" height="16" rx="4" fill="#f8fafc" stroke="#ea580c" stroke-width="2"/>
              <rect x="-14" y="-3" width="28" height="6" fill="#1d4ed8"/>
            </g>
            <!-- Gerbong 1 -->
            <g transform="translate(74, 16) rotate(-12)">
              <rect x="-18" y="-8" width="36" height="16" rx="4" fill="#f8fafc" stroke="#ea580c" stroke-width="2"/>
              <rect x="-14" y="-3" width="28" height="6" fill="#1d4ed8"/>
            </g>
            <!-- Kepala KRL (Tepat di Puncak) -->
            <g transform="translate(114, 12)">
              <rect x="-19" y="-8" width="38" height="16" rx="7" fill="#f8fafc" stroke="#ea580c" stroke-width="2"/>
              <path d="M10 -6 L17 -2 L17 2 L10 6 Z" fill="#0f172a"/>
            </g>
          </svg>
        </div>

        <!-- Kereta Cepat + 2 Gerbong (Detik) -->
        <div class="orbit sec-smooth" id="bulletOrbit">
          <svg class="train-outer-svg" viewBox="0 0 240 75">
            <!-- Gerbong 2 -->
            <g transform="translate(52, 26) rotate(-20)">
              <rect x="-20" y="-8" width="40" height="16" rx="4" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5"/>
              <rect x="-15" y="-4" width="30" height="8" rx="2" fill="#ffffff"/>
            </g>
            <!-- Gerbong 1 -->
            <g transform="translate(95, 16) rotate(-9)">
              <rect x="-20" y="-8" width="40" height="16" rx="4" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5"/>
              <rect x="-15" y="-4" width="30" height="8" rx="2" fill="#ffffff"/>
            </g>
            <!-- Kepala Lokomotif Cepat (Tepat di Puncak) -->
            <g transform="translate(140, 12)">
              <path d="M-20 -8 H10 Q22 -8 24 0 Q22 8 10 8 H-20 Z" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5"/>
              <path d="M11 -5 L19 -2 L19 2 L11 5 Z" fill="#0f172a"/>
              <circle cx="22" cy="-3" r="1.5" fill="#fef08a"/>
              <circle cx="22" cy="3" r="1.5" fill="#fef08a"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="legend">🚂 Jam • 🚃 Menit • 🚄 Detik</div>
    </div>
  </div>

  <div class="digital-sub" id="dateText">Memuat tanggal...</div>
  <script src="script.js"></script>
</body>
</html>
