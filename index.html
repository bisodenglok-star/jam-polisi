<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Jam Polisi & KAI Indonesia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="clocks-wrapper">
    <!-- JAM 1: KONVOI DARURAT -->
    <div class="clock-card">
      <div class="clock-face" id="policeClock">
        <div class="lane-outer"></div>
        <div class="lane-inner"></div>
        <div class="lane-hour"></div>
        <div class="center-island" id="digital1">00:00</div>

        <div class="orbit" id="ambOrbit">
          <svg class="veh-inner" viewBox="0 0 100 52">
            <rect x="4" y="6" width="90" height="40" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
            <rect x="33" y="16" width="8" height="20" fill="#ef4444"/>
            <rect x="27" y="22" width="20" height="8" fill="#ef4444"/>
            <path d="M72 9 L84 13 L84 39 L72 43 Z" fill="#1e293b"/>
            <rect class="siren-red active-red" x="63" y="13" width="6" height="26" rx="2" fill="#ef4444"/>
          </svg>
        </div>

        <div class="orbit" id="motoOrbit">
          <svg class="veh-mid" viewBox="0 0 100 50">
            <rect x="12" y="14" width="16" height="22" rx="3" fill="#fff"/>
            <rect x="24" y="16" width="52" height="18" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
            <circle cx="48" cy="25" r="9" fill="#fff" stroke="#0f172a" stroke-width="2"/>
            <rect class="siren-blue active-blue" x="15" y="18" width="6" height="14" rx="2" fill="#3b82f6"/>
          </svg>
        </div>

        <div class="orbit sec-smooth" id="carOrbit">
          <svg class="veh-outer" viewBox="0 0 100 50">
            <rect x="6" y="7" width="88" height="36" rx="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
            <rect x="28" y="10" width="42" height="30" rx="5" fill="#fff"/>
            <rect id="sirenRed" class="siren-red" x="45" y="11" width="8" height="13" rx="2" fill="#ef4444"/>
            <rect id="sirenBlue" class="siren-blue" x="45" y="26" width="8" height="13" rx="2" fill="#3b82f6"/>
          </svg>
        </div>
      </div>
      <div class="legend">🚑 Jam • 🏍️ Menit • 🚓 Detik</div>
    </div>

    <!-- JAM 2: KERETA API INDONESIA (KAI) -->
    <div class="clock-card">
      <div class="clock-face train-face" id="trainClock">
        <div class="track-outer"></div>
        <div class="track-inner"></div>
        <div class="track-hour"></div>
        <div class="center-island" id="digital2">00:00</div>

        <!-- Lokomotif Uap (Jam) -->
        <div class="orbit" id="steamOrbit">
          <svg class="veh-inner" viewBox="0 0 100 50">
            <rect x="8" y="12" width="32" height="26" rx="4" fill="#dc2626"/>
            <rect x="40" y="15" width="48" height="20" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
            <circle cx="76" cy="25" r="5" fill="#f59e0b"/>
            <circle cx="20" cy="25" r="6" fill="#fef08a" opacity="0.6"/>
          </svg>
        </div>

        <!-- KRL Commuter Line (Menit) -->
        <div class="orbit" id="krlOrbit">
          <svg class="veh-mid" viewBox="0 0 110 46">
            <rect x="6" y="10" width="98" height="26" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/>
            <rect x="18" y="13" width="64" height="5" rx="1.5" fill="#dc2626"/>
            <rect x="18" y="28" width="64" height="5" rx="1.5" fill="#f59e0b"/>
            <path d="M86 12 L98 17 L98 29 L86 34 Z" fill="#0f172a"/>
          </svg>
        </div>

        <!-- Rangkaian KAI CC206 + 2 Gerbong Eksekutif (Tepat di Tengah Rel Luar) -->
        <div class="orbit sec-smooth" id="bulletOrbit">
          <svg class="train-full-svg" viewBox="0 0 296 296">
            <!-- Penyambung Gerbong (Coupler) -->
            <g transform="translate(148, 148) rotate(-29.5) translate(0, -112)">
              <rect x="-4" y="-3" width="8" height="6" fill="#0f172a"/>
            </g>
            <g transform="translate(148, 148) rotate(-10) translate(0, -112)">
              <rect x="-4" y="-3" width="8" height="6" fill="#0f172a"/>
            </g>

            <!-- Gerbong 2 KAI Eksekutif (Belakang) -->
            <g transform="translate(148, 148) rotate(-39) translate(0, -112)">
              <rect x="-15" y="-6.5" width="30" height="13" rx="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
              <rect x="-14" y="-5.2" width="28" height="2.2" fill="#1d4ed8"/>
              <rect x="-14" y="3" width="28" height="2.2" fill="#f97316"/>
              <rect x="-6" y="-2" width="12" height="4" rx="1" fill="#64748b"/>
            </g>

            <!-- Gerbong 1 KAI Eksekutif (Tengah) -->
            <g transform="translate(148, 148) rotate(-19.5) translate(0, -112)">
              <rect x="-15" y="-6.5" width="30" height="13" rx="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
              <rect x="-14" y="-5.2" width="28" height="2.2" fill="#1d4ed8"/>
              <rect x="-14" y="3" width="28" height="2.2" fill="#f97316"/>
              <rect x="-6" y="-2" width="12" height="4" rx="1" fill="#64748b"/>
            </g>

            <!-- Lokomotif KAI CC206 (Depan - Putih, Oranye & Biru Tua) -->
            <g transform="translate(148, 148) rotate(0) translate(0, -112)">
              <rect x="-17" y="-6.8" width="35" height="13.6" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
              <rect x="-15" y="-6.5" width="24" height="2.6" fill="#1e3a8a"/>
              <rect x="-15" y="3.9" width="24" height="2.6" fill="#1e3a8a"/>
              <path d="M9 -6.5 H16 Q19 -6.5 19 0 Q19 6.5 16 6.5 H9 Z" fill="#f97316"/>
              <rect x="6" y="-4.5" width="4" height="9" rx="1" fill="#0f172a"/>
              <circle cx="-4" cy="0" r="3" fill="#94a3b8"/>
              <circle cx="-11" cy="0" r="2.5" fill="#94a3b8"/>
              <circle cx="18.5" cy="-2.8" r="1.3" fill="#fef08a"/>
              <circle cx="18.5" cy="2.8" r="1.3" fill="#fef08a"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="legend">🚂 Jam • 🚃 Menit • 🇮🇩 KAI Detik</div>
    </div>
  </div>

  <div class="digital-sub" id="dateText">Memuat tanggal...</div>
  <script src="script.js"></script>
</body>
</html>
